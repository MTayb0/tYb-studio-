<section class="module-card">
  <h2>Welcome to the module system</h2>
  <p>This example is loaded from its own folder. Future modules can add their own UI and logic without editing the main app files.</p>
  <label for="demoName">Try the module</label>
  <input id="demoName" type="text" maxlength="60" placeholder="Enter a name">
  <button id="demoButton" type="button">Say hello</button>

</section>
